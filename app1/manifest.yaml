apiVersion: apps/v1 
kind: Deployment
metadata: 
  name: app1
  labels:
    project: roboshop 
    tier: frontend
    component: app1
spec:
  replicas: 2
  selector:
    # using this labels replica set selects the pod
    matchLabels:
         project: roboshop 
         tier: frontend
         component: app1
  # this is POD Definition ,pod is subset of replicaset
  template:
     metadata:
       labels: 
          project: roboshop 
          tier: frontend
          component: app1 
     spec:
       containers:
         - name: app1
           #image: nginx 
           image: mahesh050917/app1:1.0.0

---
apiVersion: v1 
kind: Service 
metadata:
  name: app1
spec:
  selector:
      project: roboshop 
      tier: frontend
      component: app1 
      
  ports:
    - protocol: TCP 
      port: 80  # Service Port
      targetPort: 80 # Container Port

---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: app1
  annotations:
    alb.ingress.kubernetes.io/listen-ports: '[{"HTTPS": 443}]'
    alb.ingress.kubernetes.io/certificate-arn: 'arn:aws:acm:us-east-1:024579064366:certificate/84655790-2a42-44bc-bcd8-fd7f12b45645'
    alb.ingress.kubernetes.io/scheme: internet-facing
    alb.ingress.kubernetes.io/tags: Environment=dev,Project=roboshop
    alb.ingress.kubernetes.io/target-type: ip
    alb.ingress.kubernetes.io/group.name: roboshop
spec:
  ingressClassName: alb
  rules:
  - host: "app1.daws88s.online"
    http:
      paths:
      - pathType: Prefix
        path: "/"
        backend:
          service:
            name: app1
            port:
              number: 80
